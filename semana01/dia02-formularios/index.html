<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
</head>
<body>
    <main class="container">
        <h1>formularios + Inputs</h1>
        <form>
            <h2>Inputs</h2>
            <label for="input1">Input tipo texto</label>
            <input id="input1" placeholder="Ingresa algún texto"/>
            <label>
                input (solo lectura)
                <input readonly value="Copia este código" placeholder="input de solo lectura" type="text"/>
            </label>

            <label>
                input (Desactivado)
                <input disabled placeholder="input de solo lectura" type="text"/>
            </label>

            <label>
                input (number)
                <input placeholder="Edad Ej. 18" type="number" min="18" max="90"/>
            </label>

            <label>
                input (email)
                <input placeholder="Correo Ej. correo@gmail.com" type="email"/>
            </label>
            <label>
                input (rango)
                <input type="range" min="0" max="100">
            </label>

            <label>
                input (teléfono)
                <input type="tel" placeholder="(+51) 999 999 999"/>
            </label>

            <label>
                input (url)
                <input type="url" placeholder="Ej. misitio.com"/>
            </label>

            <label>
                input (paswwword)
                <input type="paswwword" placeholder="paswwword"/>
            </label>

            <label>
                input (color)
                <input type="color"/>
            </label>

            <label>
                input (busqueda)
                <input type="search"/>
            </label>

            <label>
                input (archivo - seleccionar un archivo a la vez) Ej. .png
                <input type="file" accept=".png"/>
            </label>

            <label>
                input (archivo - seleccionar múltiple archivo a la vez) Ej. .pdf
                <input type="file" accept=".pdf" multiple/>
            </label>

            <input type="hidden" value="datos ocultos">
            
            <input type="button" value="Hola soy un boton">
            <button>hola otra vez </button>
            <input type="submit" value="Guardar">
        </form>

        <form>
            <h2>Input tipo fecha y hora</h2>
            <label>
                Input tipo fecha y hora 
                <input type="datetime-local">
            </label>

            <label>
                Input tipo fecha 
                <input type="date">
            </label>

            <label>
                Input tipo hora 
                <input type="time">
            </label>

            <label>
                Input tipo semana 
                <input type="week">
            </label>

            <label>
                Input tipo mes 
                <input type="month">
            </label>
            <input type="submit" value="Guardar">
        </form>
        <form>
            <h2>Textareaa</h2>
            <label>
                <textarea placeholder="Escribe una descripcion sobre ti ..." rows="6" cols="4">hola a todos</textarea>
            </label>
        </form>
        <form>
            <h2>
                <label>
                    Seleccion simple
                    <select>
                    <option>seleccionar tu comida favorita...</option>
                    <option value="fr">Francesa</option>
                    <option value="it">Italiana</option>
                    <option value="jp">Japonesa</option>
                    <option value="pe">Peruana</option>
                    <option value="th">Tailandesa</option>
                    </select>
                </label>
                <label>
                    Seleccion múltiple
                    <select multiple>
                    <option>seleccionar tu comida favorita...</option>
                    <option value="fr">Francesa</option>
                    <option value="it">Italiana</option>
                    <option value="jp">Japonesa</option>
                    <option value="pe">Peruana</option>
                    <option value="th">Tailandesa</option>
                    </select>
                </label>
            </h2>
        </form>
        <form>
            <h2>Checkboxes</h2>
            <h3>Lenguajes de preferencia</h3>
            <label>
                <input type="checkbox" name="english" value="en">
                Ingles
            </label>
            <label>
                <input type="checkbox" name="spanish" value="es">
                Español
            </label>
            <label>
                <input type="checkbox" name="dothraki" value="do">
                Dothraki
            </label>
        </form>

        <form>
            <h2>Radio buttons</h2>
            <h3>Seleccione el lenguaje de preferencia</h3>
            <label>
                <input type="radio" name="lenguaje" value="en">
                Ingles
            </label>
            <label>
                <input type="radio" name="lenguaje" value="es">
                Español
            </label>
            <label>
                <input type="radio" name="lenguaje" value="do">
                Dothraki
            </label>

            <h3>Seleccione su comida favorita</h3>

            <label>
                <input type="radio" name="comida" value="ceviche">
                Cevivhe
            </label>
            <label>
                <input type="radio" name="comida" value="causa">
                Causa
            </label>
            <label>
                <input type="radio" name="comida" value="Arroz">
                Arroz con pato
            </label>
        </form>

        <form>
            <h2>Validaciones</h2>
            <label>
                Nombre (obligatorio)
                <input type="text" name="Nombre" required minlength="3" maxlength="15" />
            </label>
            <label>
                Email (obligatorio)
                <input type="email" name="correo" required />
            </label>
            <label>
                Comidas (obligatorio)
                <select name="comidas" required>
                    <option value="Selecciona tu comida favorita..."></option>
                    <option>Francesa</option>
                    <option>Peruana</option>
                    <option>Italiana</option>
                </select>
                
            </label>
            <input type="submit" value="Guardar"/>
        </form>
    </main>
</body>
</html>
